name: SonarQube Analysis
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6  # Updated to v6 for Node 24 support
        with:
          fetch-depth: 0 
          
      - name: SonarCloud Scan
        # This is the new consolidated action that replaces 'sonarcloud-github-action'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=noebarranco
            -Dsonar.projectKey=noebarranco_juice-shop
